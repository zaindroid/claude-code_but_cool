name: codez
memory_mb: 768
port: 8080
domains:
  - codez.zaindroid.me
env:
  SESSION_SECRET:
    generate: hex
  # The very first account is created automatically from these two at first boot -- see
  # backend/src/auth.js's bootstrapAdmin. Every other account is invite-only, created by that
  # admin afterward (POST /api/admin/users) -- nobody can self-register.
  ADMIN_USERNAME:
    required: true
  ADMIN_PASSWORD:
    required: true
# ANTHROPIC_API_KEY is not a top-level env var here -- each account sets its own provider (API key,
# or a whole other Anthropic-API-compatible endpoint like DeepSeek/Kimi) from Forge's own Settings
# page, stored per-account, encrypted -- see backend/src/settings.js. There is deliberately no
# server-wide key shared across accounts.
